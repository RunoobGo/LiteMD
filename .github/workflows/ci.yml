# GitHub Actions CI for LiteMD
# 职责：每次 push/PR 跑 go/node 测试矩阵 + npm audit，作为合并前置门禁。
# 多平台 wails 构建与 GitHub Release 发布由 .github/workflows/build.yml 独占
# （打 v* tag 触发），避免 CI 与发布工作流重复占用 macOS runner 分钟。
#
# 任务：go-test / frontend-test / npm-audit 全部为合并前置拦截。任一失败 block PR。
name: ci

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Go 测试矩阵：linux/macos/windows + race 检测
  # 复用 cache（按 go.sum + 源文件路径哈希）保持增量速度
  # -------------------------------------------------------------------
  go-test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v7

      # 从 go.mod 读取版本，避免与 go.mod 的 go 指令漂移（曾因固定 1.23 而编译失败）
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # gofmt 门禁（2026-09-18 审查补）：此前仓库无任何格式校验，5 个文件
      # 长期存在对齐漂移（app.go / app_test.go / main.go / links.go /
      # links_test.go）却无人发现。格式不统一会让 diff 混入纯空白噪声，
      # 也让"注释里承诺的检查是否真的存在"这类审计更难做。
      - name: gofmt check
        shell: bash
        run: |
          unformatted="$(gofmt -l . | grep -v 'node_modules' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请本地执行 gofmt -w 后提交"
            echo "$unformatted" | while IFS= read -r f; do echo "::error::$f"; done
            gofmt -d $unformatted | head -n 60
            exit 1
          fi
          echo "gofmt: 全部合规"

      # main.go 用 //go:embed all:frontend/dist 嵌入前端产物，不先构建会报
      # "pattern all:frontend/dist: no matching files found"（根包 setup failed）。
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: build frontend (embed 前置)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 三平台统一用 bash（规避 Windows PowerShell 引号差异）；-v 让失败测试/
      # panic/编译错误以 ::error:: 注解形式暴露，失败时打印末尾日志便于定位根因。
      # （Windows 曾失败的根因是 config.Path() 用 os.UserHomeDir 不读 HOME，
      #  测试 t.Setenv("HOME",...) 隔离在 Windows 失效 → 已修复于 internal/config/config.go）
      - name: go test (${{ matrix.os == 'windows-latest' && 'no-race' || 'race' }})
        shell: bash
        run: |
          set -o pipefail
          RACE=""
          if [ "${{ matrix.os }}" != "windows-latest" ]; then RACE="-race"; fi
          go test ./... $RACE -count=1 -v 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::go test 失败 (exit $code)"
            # 把关键失败信号直接提升为注解，便于在 Annotations 面板看到根因
            grep -E '^(--- FAIL|panic:|#[[:space:]]|build failed)' test.log \
              | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            echo "::group::末尾 60 行日志"
            tail -n 60 test.log
            echo "::endgroup::"
          fi
          exit "$code"

      # 覆盖率（仅在 main 分支非 PR 时上传，可选）
      - name: go test coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          go test ./... -coverprofile=coverage.out -count=1
          go tool cover -func=coverage.out | tail -1

  # -------------------------------------------------------------------
  # 前端：tsc 类型检查 + 单测
  # -------------------------------------------------------------------
  frontend-test:
    name: frontend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # tsc 类型检查：test 模式是为了 npm test 也要先过类型
      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit

      - name: run unit tests
        working-directory: frontend
        env:
          LITEMD_TEST: all
        run: npx tsx src/preview.test-bootstrap.ts

  # -------------------------------------------------------------------
  # npm audit：依赖 CVE 前置拦截（medium 以上才 fail，避免噪声）
  # 试运行 verify-deps 确认脚本签名
  # -------------------------------------------------------------------
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        working-directory: frontend
        run: npm install

      - name: audit (>= high)
        working-directory: frontend
        run: |
          npx --yes npm-audit-resolver@^1 --audit-level=high || \
          (echo "::warning::npm-audit-resolver 未装上，回退到 npm audit"; npm audit --audit-level=high)
