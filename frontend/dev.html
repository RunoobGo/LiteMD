<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>LiteMD (browser-mock)</title>
    <script>
        /* 尽早应用用户保存的主题偏好(与 index.html 保持一致,防闪烁) */
        try {
            document.documentElement.dataset.theme =
                localStorage.getItem("litemd:theme") === "light" ? "light" : "dark";
        } catch (e) { /* localStorage 不可用时保持默认暗色 */ }
    </script>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
    <!-- 启动屏：等 CodeMirror 初始化完成后由 main.ts 隐藏 -->
    <div id="splash" class="splash">
        <div class="splash-inner">
            <div class="splash-logo">
                <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
                    <defs>
                        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#58A6FF"/>
                            <stop offset="100%" stop-color="#1F6FEB"/>
                        </linearGradient>
                    </defs>
                    <rect x="6" y="6" width="52" height="52" rx="10" fill="url(#g)"/>
                    <text x="32" y="42" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="28" font-weight="700">L</text>
                </svg>
            </div>
            <h1 class="splash-title">LiteMD</h1>
            <p class="splash-tagline">极致轻量 · Markdown 编辑器</p>
            <div class="splash-spinner">
                <span></span><span></span><span></span>
            </div>
            <p class="splash-version" id="splashVersion">v0.2.10</p>
        </div>
    </div>

    <div id="app" class="app-hidden">
        <header class="topbar">
            <div class="brand">LiteMD <span style="color:var(--accent);font-weight:400;font-size:11px">mock</span></div>
            <nav class="actions">
                <button data-action="toggle-sidebar" data-tip="大纲 (Ctrl+B)" aria-label="大纲" aria-pressed="true">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="1.75" y="2.5" width="12.5" height="11" rx="1"/>
                        <path d="M5.5 2.5v11"/>
                        <path d="M7.5 6h4M7.5 9h4"/>
                    </svg>
                    <span class="tip">大纲 (Ctrl+B)</span>
                </button>
                <span class="sep"></span>
                <button data-action="new" data-tip="新建 (Ctrl+N)" aria-label="新建">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 1.5H3.5A1 1 0 0 0 2.5 2.5v11a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V5.5L9 1.5z"/>
                        <path d="M8.5 1.5V5h3.5"/>
                        <path d="M8 8v4M6 10h4"/>
                    </svg>
                    <span class="tip">新建 (Ctrl+N)</span>
                </button>
                <button data-action="open" data-tip="打开 (Ctrl+O)" aria-label="打开">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1.5 4a1 1 0 0 1 1-1H6l1.5 1.5h6a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4z"/>
                    </svg>
                    <span class="tip">打开 (Ctrl+O)</span>
                </button>
                <button data-action="save" data-tip="保存 (Ctrl+S)" aria-label="保存">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2.5 2.5h9l2 2v9a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1z"/>
                        <path d="M4.5 2.5v3h5v-3"/>
                        <path d="M4.5 9.5h7v4h-7z"/>
                    </svg>
                    <span class="tip">保存 (Ctrl+S)</span>
                </button>
                <button data-action="save-as" data-tip="另存为 (Ctrl+Shift+S)" aria-label="另存为">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2.5 2.5h7l2 2v2"/>
                        <path d="M4.5 2.5v3h4v-3"/>
                        <path d="M4.5 9.5h3"/>
                        <path d="M11 9.5v5M9 12.5l2 2 2-2"/>
                    </svg>
                    <span class="tip">另存为 (Ctrl+Shift+S)</span>
                </button>
                <span class="sep"></span>
                <button data-action="mode-both" data-tip="分屏" aria-label="分屏" aria-pressed="true">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="1.75" y="2.5" width="12.5" height="11" rx="1"/>
                        <path d="M8 2.5v11"/>
                    </svg>
                    <span class="tip">分屏</span>
                </button>
                <button data-action="mode-left" data-tip="仅编辑" aria-label="仅编辑" aria-pressed="false">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11.3 2a1.9 1.9 0 0 1 2.7 2.7L5 13.7l-3.7 1 1-3.7L11.3 2z"/>
                        <path d="M9.6 3.7l2.7 2.7"/>
                    </svg>
                    <span class="tip">仅编辑</span>
                </button>
                <button data-action="mode-right" data-tip="仅预览" aria-label="仅预览" aria-pressed="false">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1.5 8s2.6-5 6.5-5 6.5 5 6.5 5-2.6 5-6.5 5S1.5 8 1.5 8z"/>
                        <circle cx="8" cy="8" r="1.9"/>
                    </svg>
                    <span class="tip">仅预览</span>
                </button>
                <button data-action="sync-scroll" data-tip="同步滚动：开" aria-label="同步滚动" aria-pressed="true">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4.5 2v9.5"/><path d="M2 9l2.5 2.5L7 9"/>
                        <path d="M11.5 13.5V4"/><path d="M9 6.5L11.5 4 14 6.5"/>
                    </svg>
                    <span class="tip">同步滚动：开</span>
                </button>
                <span class="sep"></span>
                <button data-action="toggle-theme" data-tip="切换为亮色主题" aria-label="切换为亮色主题" aria-pressed="false">
                    <svg class="icon-sun" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="8" cy="8" r="3"/>
                        <path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M13.6 8.9A5.7 5.7 0 1 1 7.1 2.4a4.5 4.5 0 0 0 6.5 6.5z"/>
                    </svg>
                    <span class="tip">切换为亮色主题</span>
                </button>
            </nav>
            <div class="meta" id="meta">未保存</div>
            <!-- 无边框窗口控制：浏览器 mock 端无窗口运行时，titlebar.ts 会隐藏该组按钮 -->
            <div class="window-controls" id="windowControls" aria-label="窗口控制">
                <button class="wc-btn" data-wc="min" aria-label="最小化" title="最小化">
                    <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1 5h8"/></svg>
                </button>
                <button class="wc-btn" data-wc="max" aria-label="最大化" title="最大化">
                    <svg class="icon-max" viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" rx="0.5"/></svg>
                    <svg class="icon-restore" viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M3 1.5h4.5A1 1 0 0 1 8.5 2.5V7"/><rect x="1.5" y="3" width="5.5" height="5.5" rx="0.5"/></svg>
                </button>
                <button class="wc-btn wc-close" data-wc="close" aria-label="关闭" title="关闭">
                    <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg>
                </button>
            </div>
        </header>
        <!-- 左侧边栏：容器与内容解耦，.sidebar-body 内可挂大纲 / 文件树等面板 -->
        <aside class="sidebar" id="sidebar" aria-label="侧边栏">
            <div class="sidebar-head">
                <span class="sidebar-title">大纲</span>
                <button class="sidebar-collapse" data-action="toggle-sidebar" aria-label="收起侧边栏" title="收起侧边栏 (Ctrl+B)">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9.5 3.5L5 8l4.5 4.5"/>
                    </svg>
                </button>
            </div>
            <nav class="sidebar-body" id="tocPanel" aria-label="文档大纲"></nav>
            <div class="sidebar-resizer" id="sidebarResizer" title="拖动调整宽度 · 双击重置" role="separator" aria-orientation="vertical"></div>
        </aside>
        <div class="tabbar" id="tabbar" role="tablist"></div>
        <details class="frontmatter-panel" id="frontmatterPanel" hidden>
            <summary>
                <strong>Frontmatter</strong>
                <span id="fmKeys" class="fm-keys"></span>
            </summary>
            <div id="fmBody" class="fm-body"></div>
        </details>
        <main class="splitpane" id="splitpane" data-mode="both" style="--split-ratio: 50%;">
            <div class="pane pane-left">
                <div class="cm-host" id="cmHost"></div>
            </div>
            <div class="pane-handle" title="拖动调整宽度 · 双击重置"></div>
            <div class="pane pane-right">
                <div class="preview" id="preview"></div>
            </div>
        </main>
        <footer class="statusbar" id="statusbar">
            <span id="statusPath">未打开文件</span>
            <span id="statusPos">行 1 · 列 1</span>
            <span id="statusEncoding">UTF-8</span>
        </footer>
    </div>

    <dialog id="unsavedDialog" class="litemd-dialog">
        <form method="dialog">
            <h3>当前标签存在未保存的修改</h3>
            <p id="unsavedFileName" class="muted"></p>
            <menu>
                <button value="cancel">取消</button>
                <button value="discard" class="danger">放弃修改</button>
                <button value="save" autofocus>保存</button>
            </menu>
        </form>
    </dialog>

    <dialog id="errorDialog" class="litemd-dialog">
        <form method="dialog">
            <h3 id="errorTitle">操作失败</h3>
            <p id="errorBody" class="muted"></p>
            <menu>
                <button value="ok" autofocus>知道了</button>
            </menu>
        </form>
    </dialog>

    <!-- 预览链接指向非文档文件时的二次确认（与 index.html 保持一致） -->
    <dialog id="linkConfirmDialog" class="litemd-dialog">
        <form method="dialog">
            <h3>用系统默认程序打开？</h3>
            <p class="muted">该文件不是文本文档，LiteMD 无法在编辑器中打开它。</p>
            <p id="linkConfirmBody" class="muted mono"></p>
            <menu>
                <button value="cancel" autofocus>取消</button>
                <button value="open">打开</button>
            </menu>
        </form>
    </dialog>

    <!-- #3 修复：退出前协商（与 index.html 保持一致） -->
    <dialog id="quitDialog" class="litemd-dialog">
        <form method="dialog">
            <h3>存在未保存的修改</h3>
            <p id="quitHint" class="muted"></p>
            <menu>
                <button value="cancel" autofocus>取消</button>
                <button value="quit" class="danger">退出并放弃修改</button>
            </menu>
        </form>
    </dialog>

    <dialog id="overwriteDialog" class="litemd-dialog">
        <form method="dialog">
            <h3>文件已被外部程序修改</h3>
            <p id="overwriteHint" class="muted"></p>
            <menu>
                <button value="cancel" autofocus>取消</button>
                <button value="overwrite" class="danger">覆盖外部修改</button>
            </menu>
        </form>
    </dialog>

    <script src="./src/dev-bootstrap.ts" type="module"></script>
</body>
</html>
